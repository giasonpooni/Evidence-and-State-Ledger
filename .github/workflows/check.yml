# Every check this repository already runs locally, run on every push.
#
# There was no CI. One hundred and eighty-five commits on one branch, 4,879
# unit tests, 210 browser tests, a Rust kernel with 29 of its own, and nothing
# that ran any of them except a person remembering to. The verification ladder
# served at /api/v1/status reports rungs 0 through 3 as VERIFIED and names CI as
# what asserts them; this file is that party.
#
# Two jobs rather than one: `check` is the fast gate (Rust, types, lint, unit
# tests, build) and `browser` is the slow one (Playwright at desktop and Pixel
# 7, which needs the production build the config serves). Splitting them means a
# type error is reported in two minutes instead of eight.
name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref supersedes this run. The one exception is the
  # default branch, where every commit's result is worth keeping.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The screenshot and asset steps must never reach a font or tile host.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: kernel, types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history, not the default depth-1. A shallow clone grafts HEAD to
      # have no parents, so `git rev-list --parents` reports none while the
      # commit object plainly carries two — and src/adapter/selfCapture.test.ts
      # checks the self-observation rail against git as an independent oracle.
      # In a shallow checkout git is not an oracle; it is a different answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      # The kernel is a build input, not an optional extra: `npm test` builds it
      # first because src/state-kernel/store.test.ts runs against the real
      # executable rather than a stub. Both cargo commands pass --locked, which
      # is why native/state-kernel/Cargo.lock has to be committed — this run is
      # what discovered it was not.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/state-kernel/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/state-kernel/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instrument replay source-pin and strict-JSON adversarial tests
        run: python -B scripts/test_instrument_replay_verify.py

      # `npm run check` is kernel:test && typecheck && lint && test, in that
      # order, and it is what a contributor runs. Running the same command means
      # CI cannot drift from the local gate.
      - run: npm run check

      - run: npm run build

      # The digest fixtures are recomputed by src/fixtures/digest.test.ts, which
      # `npm test` already ran. This asserts the working tree is unchanged by
      # the build itself — a generated file committed stale is the failure mode.
      - name: Working tree is clean after the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'The build modified tracked files. Commit the regenerated output.'
            git status --porcelain
            git diff
            exit 1
          fi


  dependency-refresh:
    name: temporary patched dependency lock
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - name: Resolve patched Next production dependency
        run: |
          npm install next@16.3.7 --save-exact --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit exact generated lock files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: patch Next production dependency to 16.3.7'
            git push origin HEAD:feat/industrial-runtime-hardening-v1-20260929
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          retention-days: 1
          if-no-files-found: error

  browser:
    name: browser tests (desktop and Pixel 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts serves the production build, so a source change is
      # invisible to these tests until this step runs.
      - run: npm run build

      - run: npx playwright test --project=desktop --project=mobile

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
