name: Industrial source review
on:
  push:
    branches: [feat/industrial-source-review-v1-20260929]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - name: Qualification tests when implemented
        run: |
          if test -f src/acquisition/industrial-review.test.ts; then
            npx vitest run src/acquisition/industrial-review.test.ts src/acquisition/store.test.ts src/domain/admission.test.ts
          fi
      - name: Private qualification artifact
        if: always()
        run: |
          mkdir -p /tmp/industrial-evidence
          git archive --format=tar.gz HEAD src docs scripts package.json package-lock.json tsconfig.json > /tmp/industrial-evidence/source.tar.gz
          git rev-parse HEAD > /tmp/industrial-evidence/commit.txt
          git rev-parse HEAD^{tree} > /tmp/industrial-evidence/tree.txt
          test ! -d node_modules || tar -czf /tmp/industrial-evidence/dependencies.tar.gz node_modules
          test ! -d artifacts/industrial || cp -r artifacts/industrial /tmp/industrial-evidence/
          sha256sum /tmp/industrial-evidence/*.tar.gz > /tmp/industrial-evidence/sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: industrial-review-${{ github.sha }}
          path: /tmp/industrial-evidence/
          retention-days: 7
          if-no-files-found: error
