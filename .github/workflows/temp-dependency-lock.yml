name: Temporary dependency lock qualification
on:
  push:
    branches: [feat/industrial-runtime-hardening-v1-20260929]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - name: Resolve patched Next production dependency
        run: |
          npm install next@16.3.7 --save-exact --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          retention-days: 1
          if-no-files-found: error
